[project]
name = "nextmove-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
extend-exclude = ["app/models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
