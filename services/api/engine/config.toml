# Finance engine constants. All synthetic, all documented, all deterministic.
# The engine reads every number from here; nothing is hard-coded in the formulas.

as_of = "2026-10-24T09:00:00Z"   # fixed "today" so results never drift between runs

[market]
# Value = median of cached SerpApi comps for the model-year (when at least min_comps) − (miles over expected × per_mile_adjust).
# Fallback without comps: msrp × retention[age] − (miles over expected × per_mile_adjust).
source = "NextMove depreciation table (synthetic)"
min_comps = 3
band = 0.06                       # ± range shown on GET /market when there are no comps
expected_miles_per_year = 12000
per_mile_adjust = 0.10            # $ per mile above/below expected
retention = [1.00, 0.90, 0.84, 0.80, 0.76, 0.71, 0.66, 0.61, 0.56, 0.52, 0.48]   # index = age in years

[market.msrp]
Camry = 29500
RAV4 = 34500
Tacoma = 36500
Highlander = 42000
Prius = 29500
bZ = 40000

[rates]
# Market APRs by credit tier (percent). TFS buyout / refinance / new-vehicle financing.
buyout = { A = 6.4, B = 7.9, C = 10.9, D = 14.9 }
refinance = { A = 5.4, B = 6.9, C = 9.9, D = 13.9 }
new_vehicle = { A = 5.9, B = 7.4, C = 10.4, D = 14.4 }

[fees]
purchase_option = 300      # lease buyout fee
disposition = 350          # lease return fee
wear_estimate = 400        # default until photo pre-inspection (B4) supplies a real estimate
dealer_doc = 650           # new-vehicle doc + acquisition fees
refinance = 0
extension = 0
late = 50                  # charged once a payment is more than late_after_days past due
late_after_days = 10
due_date_change = 0

[terms]
buyout_months = 60
upgrade_months = 60
lease_extension_months = 6
loan_extension_months = 12
max_loan_term_months = 84

[driving]
# True cost + CO2 inputs (BUILD_PLAN §5.6: documented synthetic constants).
gas_price = 3.40               # $/gal
electricity_price = 0.16       # $/kWh
kwh_per_gallon_equivalent = 33.7
co2_kg_per_gallon = 8.887      # EPA tailpipe CO2 per gallon of gasoline
co2_kg_per_kwh = 0.37          # US grid average
maintenance = { gas = 85, hybrid = 45, ev = 35 }   # $/month

[driving.insurance]            # $/month estimate by model
Camry = 145
RAV4 = 150
Tacoma = 165
Highlander = 175
Prius = 140
bZ = 160

